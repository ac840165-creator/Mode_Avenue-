<!DOCTYPE html>
<html>
<head>
    <title>Admin Access - Mode Avenue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #2a5298 0%, #1e3c72 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .access-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #2a5298, #1e3c72);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            color: white;
            font-size: 2rem;
        }
        .btn-admin {
            background: linear-gradient(135deg, #2a5298, #1e3c72);
            color: white;
            border: none;
            padding: 0.875rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }
    </style>
</head>
<body>
    <div class="access-card">
        <div class="icon-circle">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2 class="mb-3">Admin Access Granted!</h2>
        <p class="text-muted mb-4">All user accounts now have admin privileges. You can access the admin dashboard with any account.</p>
        
        <div class="alert alert-info mb-4">
            <i class="fas fa-info-circle"></i> If you were already logged in, please <strong>logout and login again</strong>.
        </div>
        
        <div class="d-grid gap-2">
            <a href="{{ url_for('auth.login') }}" class="btn btn-admin">
                <i class="fas fa-sign-in-alt"></i> Go to Login
            </a>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                Try Admin Dashboard
            </a>
        </div>
    </div>
</body>
</html>
